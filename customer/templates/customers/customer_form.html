{% extends "base.html" %}

{% block title %}Add Customer | Bidii Quality Builders{% endblock %}

{% block content %}
<section style="max-width: 720px; margin: 1.5rem auto; padding: 1rem;">
    <h1 style="margin-bottom: 0.35rem;">Add New Customer</h1>
    <p style="margin-top: 0; color: #555;">Capture customer details for future estimates and jobs.</p>

    <form method="post"
        style="display: grid; gap: 0.85rem; background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 1rem;">
        {% csrf_token %}
        {{ form.as_p }}

        <div style="display: flex; gap: 0.6rem; margin-top: 0.4rem;">
            <button type="submit"
                style="background: #0b63ce; color: #fff; border: none; padding: 0.55rem 0.95rem; border-radius: 6px; cursor: pointer;">
                Save Customer
            </button>
            <a href="{% url 'customer-list' %}"
                style="display: inline-block; text-decoration: none; border: 1px solid #bbb; color: #222; padding: 0.48rem 0.85rem; border-radius: 6px;">
                Cancel
            </a>
        </div>
    </form>
</section>
{% endblock %}
