{% load tailwind_tags %}
<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Bidii Quality Builders{% endblock %}</title>
    {% tailwind_css %}
</head>

<body class="min-h-screen bg-gray-50 text-gray-700 tracking-normal leading-relaxed">
    <header class="bg-white border-b border-gray-200 shadow-sm">
        <nav class="max-w-5xl mx-auto px-6 flex items-center justify-between h-14">
            <a href="{% url 'dashboard' %}" class="text-base font-semibold text-gray-900">Bidii Quality Builders</a>
            <div class="flex items-center gap-4 text-sm">
                <a href="{% url 'dashboard' %}"
                    class="text-gray-500 hover:text-gray-900 transition-all duration-150">Dashboard</a>
                <a href="{% url 'customer-list' %}"
                    class="text-gray-500 hover:text-gray-900 transition-all duration-150">Customers</a>
                <a href="{% url 'estimate-list' %}"
                    class="text-gray-500 hover:text-gray-900 transition-all duration-150">Estimates</a>
                <a href="{% url 'job-list' %}"
                    class="text-gray-500 hover:text-gray-900 transition-all duration-150">Jobs</a>
                <a href="{% url 'invoice-list' %}"
                    class="text-gray-500 hover:text-gray-900 transition-all duration-150">Invoices</a>
            </div>
        </nav>
    </header>

    <main class="py-10">
        <div class="max-w-5xl mx-auto px-6">
            {% block content %}
            {% endblock %}
        </div>
    </main>
</body>

</html>
