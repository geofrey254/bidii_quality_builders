{% if messages %}
<div class="space-y-3">
    {% for message in messages %}
    {% if message.tags == 'success' %}
    <div class="rounded-md border border-gray-200 bg-white px-4 py-3 text-sm text-gray-700 shadow-sm">{{ message }}
    </div>
    {% elif message.tags == 'error' %}
    <div class="rounded-md border border-gray-200 bg-white px-4 py-3 text-sm text-gray-700 shadow-sm">{{ message }}
    </div>
    {% elif message.tags == 'warning' %}
    <div class="rounded-md border border-gray-200 bg-white px-4 py-3 text-sm text-gray-700 shadow-sm">{{ message }}
    </div>
    {% else %}
    <div class="rounded-md border border-gray-200 bg-white px-4 py-3 text-sm text-gray-700 shadow-sm">{{ message }}
    </div>
    {% endif %}
    {% endfor %}
</div>
{% endif %}
